<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'Space Grotesk',system-ui,sans-serif">
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1a1e"/><stop offset="1" stop-color="#0a0f14"/>
    </linearGradient>
    <linearGradient id="mc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#mg)"/>
  <g transform="translate(560,90)">
    <rect x="0" y="0" width="480" height="820" rx="54" fill="#0c0c14" stroke="#2a2a3a" stroke-width="2"/>
    <rect x="16" y="16" width="448" height="788" rx="40" fill="#101018"/>
    <rect x="180" y="34" width="120" height="20" rx="10" fill="#0c0c14"/>
    <!-- header -->
    <text x="44" y="120" fill="#f4f4fa" font-size="30" font-weight="600">Hola, Broa</text>
    <text x="44" y="152" fill="#6b6b80" font-size="16">Tu resumen de hoy</text>
    <circle cx="410" cy="120" r="22" fill="url(#mc)"/>
    <!-- balance card -->
    <rect x="40" y="184" width="400" height="150" rx="24" fill="url(#mc)"/>
    <text x="66" y="228" fill="#0a0f14" font-size="15" opacity="0.8">Balance total</text>
    <text x="66" y="286" fill="#0a0f14" font-size="40" font-weight="700">€ 8,240.50</text>
    <!-- list -->
    <g>
      <rect x="40" y="366" width="400" height="72" rx="18" fill="#16161f"/>
      <circle cx="78" cy="402" r="18" fill="#22d3ee" opacity="0.25"/>
      <rect x="112" y="386" width="150" height="12" rx="6" fill="#2a2a3a"/>
      <rect x="112" y="410" width="90" height="10" rx="5" fill="#22222c"/>
      <text x="410" y="408" text-anchor="end" fill="#7ee787" font-size="16">+ €120</text>

      <rect x="40" y="452" width="400" height="72" rx="18" fill="#16161f"/>
      <circle cx="78" cy="488" r="18" fill="#7c3aed" opacity="0.3"/>
      <rect x="112" y="472" width="180" height="12" rx="6" fill="#2a2a3a"/>
      <rect x="112" y="496" width="70" height="10" rx="5" fill="#22222c"/>
      <text x="410" y="494" text-anchor="end" fill="#f85149" font-size="16">- €38</text>

      <rect x="40" y="538" width="400" height="72" rx="18" fill="#16161f"/>
      <circle cx="78" cy="574" r="18" fill="#22d3ee" opacity="0.25"/>
      <rect x="112" y="558" width="130" height="12" rx="6" fill="#2a2a3a"/>
      <rect x="112" y="582" width="110" height="10" rx="5" fill="#22222c"/>
      <text x="410" y="580" text-anchor="end" fill="#f85149" font-size="16">- €12</text>
    </g>
    <!-- tab bar -->
    <rect x="40" y="700" width="400" height="72" rx="24" fill="#16161f"/>
    <circle cx="96" cy="736" r="8" fill="url(#mc)"/>
    <circle cx="200" cy="736" r="8" fill="#3a3a48"/>
    <circle cx="304" cy="736" r="8" fill="#3a3a48"/>
    <circle cx="392" cy="736" r="8" fill="#3a3a48"/>
  </g>
</svg>
