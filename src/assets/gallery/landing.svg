<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'Space Grotesk',system-ui,sans-serif">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f4f8"/><stop offset="1" stop-color="#e7e3f5"/>
    </linearGradient>
    <linearGradient id="lc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#lg)"/>
  <rect x="0" y="0" width="1600" height="56" fill="#ffffff"/>
  <circle cx="30" cy="28" r="7" fill="#ff5f57"/><circle cx="54" cy="28" r="7" fill="#febc2e"/><circle cx="78" cy="28" r="7" fill="#28c840"/>
  <!-- nav -->
  <circle cx="120" cy="110" r="14" fill="url(#lc)"/>
  <text x="148" y="118" fill="#0a0a12" font-size="20" font-weight="700">Nimbus</text>
  <g fill="#8a8a99"><rect x="1120" y="102" width="70" height="12" rx="6"/><rect x="1220" y="102" width="70" height="12" rx="6"/><rect x="1320" y="102" width="70" height="12" rx="6"/></g>
  <rect x="1420" y="92" width="110" height="36" rx="18" fill="url(#lc)"/>
  <!-- hero -->
  <text x="120" y="330" fill="#0a0a12" font-size="80" font-weight="700">Envía menos.</text>
  <text x="120" y="420" fill="#0a0a12" font-size="80" font-weight="700">Cobra <tspan fill="url(#lc)">antes.</tspan></text>
  <rect x="120" y="470" width="560" height="14" rx="7" fill="#b9b9c8"/>
  <rect x="120" y="500" width="460" height="14" rx="7" fill="#c8c8d4"/>
  <rect x="120" y="560" width="180" height="52" rx="26" fill="#0a0a12"/>
  <rect x="320" y="560" width="180" height="52" rx="26" fill="none" stroke="#0a0a12" stroke-width="2"/>
  <!-- product panel -->
  <rect x="840" y="230" width="640" height="440" rx="24" fill="#ffffff" stroke="#dedee8"/>
  <rect x="872" y="266" width="220" height="16" rx="8" fill="url(#lc)"/>
  <g fill="#ececf2">
    <rect x="872" y="316" width="576" height="60" rx="12"/>
    <rect x="872" y="392" width="576" height="60" rx="12"/>
    <rect x="872" y="468" width="576" height="60" rx="12"/>
  </g>
  <rect x="872" y="560" width="200" height="48" rx="24" fill="url(#lc)"/>
  <!-- logos strip -->
  <g fill="#c4c4d0"><rect x="120" y="760" width="140" height="20" rx="10"/><rect x="300" y="760" width="140" height="20" rx="10"/><rect x="480" y="760" width="140" height="20" rx="10"/><rect x="660" y="760" width="140" height="20" rx="10"/><rect x="840" y="760" width="140" height="20" rx="10"/></g>
</svg>
