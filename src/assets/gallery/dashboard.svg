  <rect x="0" y="56" width="230" height="944" fill="#12121c"/>
  <rect x="28" y="96" width="150" height="16" rx="8" fill="url(#ac)"/>
  <g fill="#2a2a3a"><rect x="28" y="150" width="174" height="12" rx="6"/><rect x="28" y="188" width="140" height="12" rx="6"/><rect x="28" y="226" width="160" height="12" rx="6"/><rect x="28" y="264" width="120" height="12" rx="6"/></g>
