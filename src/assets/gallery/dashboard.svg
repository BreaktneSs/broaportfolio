    <text x="294" y="196" fill="#f4f4fa" font-size="44" font-weight="600">12,480</text>
    <rect x="700" y="100" width="380" height="150" rx="16" fill="none" stroke="#2a2a3a"/>
    <text x="724" y="140" fill="#6b6b80" font-size="15">Latencia p95</text>
    <text x="724" y="196" fill="#f4f4fa" font-size="44" font-weight="600">86 ms</text>
    <rect x="1130" y="100" width="380" height="150" rx="16" fill="none" stroke="#2a2a3a"/>
