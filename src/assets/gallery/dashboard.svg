    <text x="1154" y="196" fill="#f4f4fa" font-size="44" font-weight="600">3</text>
  </g>
  <!-- chart -->
  <rect x="270" y="290" width="1240" height="420" rx="16" fill="none" stroke="#2a2a3a"/>
  <text x="294" y="330" fill="#f4f4fa" font-size="18" font-weight="600">Tráfico por hora</text>
