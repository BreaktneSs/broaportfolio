<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'Space Grotesk',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141420"/><stop offset="1" stop-color="#0a0a12"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b4dff"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="56" fill="#1b1b28"/>
  <circle cx="30" cy="28" r="7" fill="#ff5f57"/><circle cx="54" cy="28" r="7" fill="#febc2e"/><circle cx="78" cy="28" r="7" fill="#28c840"/>
  <rect x="120" y="16" width="520" height="24" rx="12" fill="#0f0f18"/>
  <text x="140" y="33" fill="#6b6b80" font-size="14">app.example.com/dashboard</text>
