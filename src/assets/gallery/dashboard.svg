    <rect x="320" y="560" width="46" height="110" rx="6"/><rect x="386" y="500" width="46" height="170" rx="6"/>
    <rect x="452" y="470" width="46" height="200" rx="6"/><rect x="518" y="540" width="46" height="130" rx="6"/>
    <rect x="584" y="420" width="46" height="250" rx="6"/><rect x="650" y="390" width="46" height="280" rx="6"/>
