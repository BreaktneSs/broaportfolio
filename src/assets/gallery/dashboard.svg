    <rect x="848" y="410" width="46" height="260" rx="6"/><rect x="914" y="330" width="46" height="340" rx="6"/>
    <rect x="980" y="480" width="46" height="190" rx="6"/><rect x="1046" y="440" width="46" height="230" rx="6"/>
    <rect x="1112" y="380" width="46" height="290" rx="6"/><rect x="1178" y="520" width="46" height="150" rx="6"/>
